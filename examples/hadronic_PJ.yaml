    - 0.001

  dif_delta:
    - 0.3
    - 0.4
    - 0.5
    - 0.6
    - 0.7

  n0s: 
    - !astropy.units.Quantity
      unit: &id001 !astropy.units.Unit {unit: cm**(-3)}
      value: 0.1
    - !astropy.units.Quantity
      unit: *id001
      value: 1
    - !astropy.units.Quantity
      unit: *id001
      value: 10
